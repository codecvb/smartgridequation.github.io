<script>
  window.STATIC_POSTS = [{"id":"b154726c-0610-447d-a4d1-6d26c8e4769c","title":"悟真理淬初心 以实干赴新程——读《毛泽东选集》第一卷有感","slug":"du-mao-xuan-di-yi-juan-you-gan","summary":"重读《毛泽东选集》第一卷，从调研务实、坚守信念、扎根人民中汲取实事求是、实干笃行的精神力量。","content":"# 悟真理淬初心 以实干赴新程——读《毛泽东选集》第一卷有感\n\n翻开《毛泽东选集》第一卷，跨越近百年的岁月风尘，朴实厚重的文字依旧滚烫有力。这一卷收录的是土地革命战争时期与抗日战争初期的经典著作，诞生于中国革命最迷茫、最艰难、最曲折的岁月。彼时的中国，山河破碎、民生凋敝，革命道路迷雾重重、前路未卜，党内教条主义、主观主义滋生蔓延，无数仁人志士在黑暗中艰难求索。重读这些穿越时空的篇章，我读懂的不仅是革命年代的斗争智慧，更是扎根实际、坚守初心、直面困境、依靠人民的永恒真理，字字句句直击人心、启迪当下。\n\n《毛选》第一卷的开篇，便抛出了振聋发聩的时代之问：“谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。”在《中国社会各阶级的分析》中，毛泽东同志没有照搬书本教条、盲从外来经验，而是深入市井乡村、走访各界群众，立足中国半殖民地半封建社会的真实国情，精准剖析不同阶级的经济地位、思想状态与政治立场。一针见血指出过往革命屡屡失败的根源，就在于看不清局势、辨不清敌我、团结不了真正的力量。这篇著作让我深刻明白，**实事求是从来不是一句口号，而是立足现实、认清本质、精准破局的立身之本**。\n\n反观当下，我们身处没有硝烟的时代，没有枪林弹雨的考验，却面临着纷繁复杂的生活与工作困境。很多时候我们迷茫焦虑、做事低效、屡屡碰壁，本质上和早年革命的困境如出一辙：脱离实际、主观臆断、跟风盲从，看不清问题本质、抓不住核心关键。百年前伟人用调研摸清国情、找准革命出路，如今我们面对成长难题、工作挑战、人生抉择，同样需要摒弃空想、脚踏实地，深入实际摸清问题、直面短板、找准方向，这正是经典跨越时代的现实力量。\n\n最让我深受触动的，是贯穿全卷的**调查务实、知行合一**的真理力量。在《反对本本主义》中，伟人铿锵有力地提出：“没有调查，没有发言权。”在教条主义盛行、人人迷信书本公式的年代，他敢于打破桎梏，坚信一切真理都源于实践、一切方案都源于调研。不唯书、不唯上、只唯实，这是最朴素也最深刻的成事之道。而《湖南农民运动考察报告》更是用详实的调研事实、鲜活的基层案例，驳斥了各界对农民运动的偏见与诋毁，有力印证了基层群众中蕴藏的磅礴革命力量。\n\n这两篇著作深刻诠释了：**一切真知皆源于实践，一切成功皆立足实干**。任何脱离实际的理论都是空洞的，任何脱离群众的事业都是无源之水。当下，我们常常陷入纸上谈兵的误区，沉迷于理论学习、空想规划，却不愿躬身实践、落地行动。学习工作中，仅凭主观判断下定结论，仅凭固有经验解决新问题，最终难免出错受挫。《毛选》第一卷教会我的，是摒弃浮躁功利之心，养成脚踏实地、深入调研、躬身践行的处事态度，遇事多求证、做事多落地、遇事不盲从，在实践中认清规律、解决问题、提升自我。\n\n如果说调研务实是成事方法，那么**坚守信念、直面困境**就是贯穿全卷的精神底色。第一卷的所有著作，都诞生于革命低谷时期。大革命失败后，革命力量遭受重创，白色恐怖笼罩全国，无数人陷入迷茫动摇，甚至质疑革命前路。但伟人始终保持清醒坚定，在低谷中看见希望，在困境中开辟新路。《星星之火，可以燎原》中，面对“红旗到底打得多久”的悲观疑问，他以宏大的格局、长远的眼光断言：中国革命高潮快要到来，它是站在海岸遥望海中已经看得见桅杆尖头了的一只航船，是立于高山之巅远看东方已见光芒四射喷薄欲出的一轮朝日。\n\n跨越百年，这份绝境中不放弃、低谷中不沉沦的信念，依旧治愈和指引着当代的我们。人生从无一帆风顺，求学的压力、工作的瓶颈、生活的坎坷，都是我们面临的“人生逆境”。很多人稍有挫折便轻言放弃，些许困境便心生颓废，缺乏直面磨难的勇气、坚守初心的定力。重读经典，我愈发懂得：所有伟大的成就，都源于绝境中的坚守、困境中的突围。所谓前途光明，从来不是一帆风顺，而是认清曲折后依然笃定前行。新时代的我们，更应传承这份坚韧不拔的革命风骨，不惧困难、直面挑战，在风雨中磨砺意志，在坚守中静待花开。\n\n通读全卷，最厚重、最温暖的底色，始终是**扎根人民、依靠人民**的初心使命。从剖析各阶级力量，到肯定农民运动的伟大价值，再到动员群众、凝聚民心，整部著作始终贯穿着“人民至上”的核心逻辑。伟人始终扎根基层、贴近群众，深知革命的根基在人民、力量在人民，唯有团结群众、依靠群众、服务群众，才能战胜一切艰难险阻。正是这份始终与人民站在一起的初心，让中国革命在一次次绝境中重生、在一次次困境中崛起。\n\n如今时代变迁、山河无恙，但人民至上的初心从未过时。作为新时代青年，我们生在红旗下、长在春风里，更应读懂经典背后的为民情怀，摒弃利己主义、浮躁心态，心怀家国、心系他人。在学习中脚踏实地，在工作中担当尽责，在生活中传递温暖，把个人理想融入时代发展，以平凡之力践行初心使命，不负先辈热血、不负时代馈赠。\n\n一卷经典，百年回响，历久弥新，熠熠生辉。《毛选》第一卷不仅是中国革命的思想基石，更是当代人修身立德、处事成事、逐梦前行的精神宝典。它教会我们实事求是、求真务实，让我们破除迷茫、认清方向；教会我们坚守初心、直面困境，让我们不惧风雨、勇毅前行；教会我们扎根实际、心系人民，让我们心怀大爱、担当有为。\n\n时代各有使命，青年接续奋斗。往后余生，我将常读经典、常悟真理、常践初心，把从经典中汲取的智慧和力量，转化为脚踏实地的行动、攻坚克难的勇气、服务社会的担当，以实事求是立身，以实干笃行圆梦，以赤诚之心赴时代之约，在新时代的征程中脚踏实地、奋勇争先，不负韶华、不负时代、不负人民。\n","tags":["读书笔记","毛泽东选集","感悟"],"status":"published","viewCount":0,"createdAt":"2026-08-13T17:10:11.547Z","updatedAt":"2026-08-13T17:10:11.547Z","publishedAt":"2026-08-13T17:10:11.547Z"},{"id":"deed3c6f-2766-46a2-8167-7a92b1108626","title":"《毛泽东选集》第一卷内容与主题思想总结","slug":"mao-xuan-di-yi-juan-nei-rong-yu-zhu-ti-si-xiang-zong-jie","summary":"系统梳理《毛泽东选集》第一卷各篇核心内容，总结实事求是、农村包围城市、统一战线、群众路线与哲学思想主线。","content":"# 《毛泽东选集》第一卷内容与主题思想总结\n\n《毛泽东选集》第一卷收录**1925 年 —1937 年 7 月抗日战争全面爆发前**的著作，主要对应**大革命后期、土地革命战争时期**。这一时期中国革命经历大革命失败、白色恐怖、农村根据地建立、反 “围剿” 斗争、长征，直至抗日民族统一战线初步形成。整卷核心任务：**把马克思主义基本原理同中国革命具体实际相结合，回答半殖民地半封建的中国，革命依靠谁、打击谁、走什么道路、如何对待主观主义教条错误，为中国革命找到正确道路**。\n\n> 卷内文章大致分四大板块：大革命时期文章、井冈山与中央苏区时期文章、反围剿与党内路线斗争、长征之后转向抗日统一战线的理论。\n> \n> \n\n## 一、各篇核心内容梳理\n\n### 第一部分：大革命时期（1925‑1927）\n\n1. **《中国社会各阶级的分析》（1925\\.12）**\n核心问题：**谁是我们的敌人？谁是我们的朋友？这个问题是革命的首要问题。**\n逐一对地主买办阶级、中产阶级（民族资产阶级）、小资产阶级、半无产阶级、无产阶级做阶级分析。\n\n- 地主买办阶级：帝国主义附庸，是革命的敌人；\n\n- 民族资产阶级：具有两面性，有革命一面也有妥协动摇一面；\n\n- 小资产阶级、半无产阶级（主要是农民）：革命最广大的同盟军；\n\n- 工业无产阶级：革命的领导力量。\n批判党内右倾错误，只看重资产阶级，忽视农民力量。**奠定中国革命阶级策略的理论基础。**\n\n2. **《湖南农民运动考察报告》（1927\\.3）**\n毛泽东实地走访湖南五县，调查农民运动。\n驳斥社会上、党内对农民运动 “糟得很” 的指责，提出农民运动 “好得很”。\n阐明农民是摧毁封建地主势力的主力军，农民运动是国民革命的中心问题；要放手发动农民，建立农民政权、农民武装。\n回击压制农民运动的右倾机会主义，确立**农民问题在中国革命中的极端重要地位**。\n\n> 大革命失败教训：放弃武装、忽视农民力量，妥协退让，导致惨痛失败。\n> \n> \n\n### 第二部分：土地革命战争前期，开辟农村革命道路（1928‑1930）\n\n大革命失败后，城市暴动屡屡受挫，革命转入农村。\n\n3. **《中国的红色政权为什么能够存在？》（1928\\.10）**\n回答疑问：在四面白色政权包围下，小块红色根据地为什么可以长期存在？\n五大条件：\n①中国半殖民地半封建，各地军阀割据，白色政权间长期分裂战争；\n②大革命留下群众基础；\n③全国革命形势继续向前发展；\n④相当力量正式红军存在；\n⑤共产党组织有力量和正确政策。\n论证**工农武装割据**理论：武装斗争、土地革命、根据地建设三者结合。\n\n4. **《井冈山的斗争》（1928\\.11）**\n报告井冈山根据地现实情况：军事斗争、土地问题、政权建设、党内状况、红军建设。\n总结根据地现实困难，提出红军建军、土地分配、对待中间阶级的具体政策，是工农武装割据实践的一手总结。\n\n5. **《星星之火，可以燎原》（1930\\.1）**\n针对党内悲观论调 “红旗到底打得多久”。\n批评把希望寄托在城市武装暴动，轻视农村根据地的思想。指出：**农村革命根据地是促进全国革命高潮最重要因素**。\n形象比喻革命高潮：航船、朝日、幼芽。\n正式确立：以农村为中心，农村包围城市、武装夺取政权的革命道路思想。\n\n6. **《反对本本主义》（1930\\.5）**\n经典名句：**没有调查，没有发言权**；“中国革命斗争的胜利要靠中国同志了解中国情况”。\n尖锐批判本本主义（教条主义）：照搬书本、照搬外国经验，不从实际出发。\n提倡实地调查，一切从实际出发。\n这是**实事求是思想路线最早的系统阐述**。反对死啃书本，反对盲目服从上级指示。\n\n### 第三部分：苏区反 “围剿”、经济、军事、路线问题（1931‑1934）\n\n7. **《必须注意经济工作》《怎样分析农村阶级》《我们的经济政策》**\n面对国民党军事 “围剿”，根据地既要打仗，也要搞经济建设。\n\n- 明确农村阶级划分标准：地主、富农、中农、贫农，指导土地革命分田；\n\n- 提出根据地发展农业、手工业、对外贸易，保障红军供给，改善群众生活；\n\n- 强调革命战争和经济建设不能对立，经济为战争服务。\n\n8. **《关心群众生活，注意工作方法》（1934\\.1）**\n核心：革命战争依靠群众。要取得群众拥护，就要关心群众切身利益 —— 吃饭、穿衣、住房、看病。同时要有正确工作方法，反对官僚主义命令主义。\n“真正的铜墙铁壁是什么？是群众，是千百万真心实意拥护革命的群众。”\n\n### 第四部分：长征之后，清算主观主义，转向民族矛盾，准备抗日（1935‑1937）\n\n第五次反 “围剿” 失败，根源是党内 “左” 倾教条主义，照搬苏联军事理论，脱离中国实际。\n\n9. **《论反对日本帝国主义的策略》（1935\\.12，瓦窑堡会议报告）**\n九一八之后民族危机上升，民族矛盾逐步超过国内阶级矛盾。\n批判关门主义，系统阐述**抗日民族统一战线**理论。\n分析民族资产阶级在民族危亡条件下有参加抗日的可能性；提出要建立广泛的抗日统一战线，团结一切愿意抗日的力量，同时坚持共产党和红军的领导权。从国内战争向民族抗日战争做战略转变。\n\n10. **《中国革命战争的战略问题》（1936\\.12）**\n系统总结土地革命战争军事经验，批判 “左” 倾教条主义军事错误。\n提出：战争指导要研究战争规律，尤其要研究**中国革命战争的特殊规律**，不能照搬外国战争经验。\n分析中国革命战争四个特点：中国政治经济发展不平衡、敌人强大、红军弱小、共产党领导和土地革命。\n由此推导出红军一整套战略战术：积极防御、战略退却、诱敌深入、集中兵力、运动战。是毛泽东军事思想的奠基著作。\n\n11. **《实践论》（1937\\.7）、《矛盾论》（1937\\.8）**\n两篇哲学著作，从马克思主义认识论、辩证法高度，清算党内主观主义（教条主义、经验主义）。\n\n- **《实践论》**：核心是认识论 —— 实践是认识的来源，认识来源于实践，又回到实践接受检验。认识过程：感性认识→理性认识→实践。批判教条主义轻视实践，经验主义轻视理论。确立 “实践第一”。\n\n- **《矛盾论》**：讲辩证法。矛盾是事物发展动力；区分主要矛盾和次要矛盾、矛盾主要方面；矛盾普遍性和特殊性（**具体问题具体分析**）；不同性质矛盾用不同方法解决。\n\n> 《实践论》《矛盾论》从哲学层面，为 “实事求是” 提供完整理论支撑，解决党内长期存在的思想路线问题。\n> \n> \n\n## 二、全书贯穿的核心主题思想\n\n### 1\\. 思想路线：实事求是，反对主观主义（教条主义、经验主义）\n\n这是第一卷最根本的主线。\n当时党内很大问题：照搬马克思书本、照搬苏联经验，不看中国国情。\n全书反复强调：中国国情特殊，不能简单套用外国公式。一切结论产生于调查情况末尾，而不是在它的先头。**不唯书、不唯上，要唯实**。《反对本本主义》《实践论》《矛盾论》共同完成这套思想论证。\n\n### 2\\. 革命道路：农村包围城市，武装夺取政权\n\n大革命失败证明城市道路走不通。\n通过工农武装割据，建立农村根据地，开展土地革命，发展红军，以农村积蓄革命力量，最后夺取全国政权。\n包含三层：武装斗争是主要斗争形式；土地革命是中心内容；农村革命根据地是战略阵地。\n\n### 3\\. 阶级与统一战线思想：分清敌友，团结最大多数\n\n革命首要问题分清敌人、朋友。\n依靠力量：无产阶级领导，以农民为主力军；团结小资产阶级，争取民族资产阶级；打击帝国主义及其附庸地主买办阶级。\n随着民族危机上升，进一步发展为抗日民族统一战线：国内阶级斗争服从民族斗争，团结一切抗日力量，同时坚持独立自主。\n\n### 4\\. 群众观点：革命根基在人民群众\n\n农民是中国革命最广大同盟军。战争的伟力之最深厚根源存在于民众之中。\n革命不是少数人斗争，必须关心群众利益，依靠群众，反对官僚主义、命令主义。没有群众支持，根据地、红军都无法生存。\n\n### 5\\. 军事思想：立足敌强我弱现实，实行积极防御\n\n敌大我小、敌强我弱是中国革命战争基本现实。\n不能搞冒险主义进攻，也不能消极逃跑；采取积极防御：诱敌深入、集中兵力打运动战，在运动中消灭敌人。反对死搬硬套正规战的教条军事路线。\n\n### 6\\. 哲学内核：实践论与矛盾论\n\n认识来源于实践，又服务实践；看问题要抓主要矛盾，具体问题具体分析。\n把马克思主义哲学本土化，用来解决中国革命现实问题，为之后全党的思想统一打下哲学基础。\n\n## 三、第一卷整体历史地位\n\n第一卷完整展现了中国共产党如何摆脱教条束缚，**把马克思主义和中国实际结合起来**，从一次次失败中摸索出适合中国国情的革命理论与道路。\n内容从阶级分析→农民问题→工农武装割据→军事策略→统一战线，最后上升到哲学高度，形成一套完整思想链条，是毛泽东思想形成时期最重要的文献集合。\n\n如果你需要，我可以再帮你压缩成考试答题版（几百字简答），或者按考点整理成要点。\n\n> （注：部分内容可能由 AI 生成）\n","tags":["读书笔记","毛泽东选集","总结"],"status":"published","viewCount":0,"createdAt":"2026-08-13T17:10:11.531Z","updatedAt":"2026-08-13T17:10:11.531Z","publishedAt":"2026-08-13T17:10:11.531Z"},{"id":"3da9b085-4273-4869-955a-5f840280c4c9","title":"你好，世界","slug":"hello-world","summary":"这套博客的第一篇文章：介绍 Markdown 写作、目录、标签、搜索与图片上传等能力。","content":"# 你好，世界\n\n这是你的第一篇文章，由系统自动创建，用来演示整套博客的写作能力。\n\n## 用 Markdown 写作\n\n**加粗**、*斜体*、`行内代码`，还有链接 [OpenAI](https://openai.com)。\n\n> 好的博客像一盏灯，不需要很亮，但要在黑夜里持续亮着。\n\n## 代码块\n\n```js\nconsole.log('欢迎来到你的博客');\n```\n\n## 已经内置的能力\n\n- 自动目录与阅读时长\n- 标签归档与全文搜索\n- 图片上传与 Markdown 编辑器\n- 草稿、发布与阅读统计\n\n登录后台后，在「写文章」页面开始你的第一篇正式内容吧。`","tags":["随笔","Markdown"],"status":"published","viewCount":0,"createdAt":"2026-08-10T13:27:53.894Z","updatedAt":"2026-08-10T13:27:53.894Z","publishedAt":"2026-08-10T13:27:53.894Z"},{"id":"70fa1c95-927a-4b03-9251-9c62a84696b5","title":"把博客放上云端：免费挂载方案盘点","slug":"free-hosting-options-2026","summary":"整理 2026 年仍可用的免费与低价部署方案，从开箱即用的 Render 到长期免费的 Oracle Cloud。","content":"# 把博客放上云端\n\n写好的博客需要一台“常亮”的服务器。以下是 2026 年 8 月核实过的免费与低价挂载方案。\n\n## 上手最快：Render 免费 Web Service\n\nRender 官方免费档支持 Web Service 直接部署 Node.js 应用，15 分钟无访问会自动休眠，下次
